<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>めっちゃかんご | 看護師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/base.css?v=20261009-2355">
<link rel="stylesheet" href="../shared/css/components.css?v=20261009-2355">
<link rel="stylesheet" href="nurse.css?v=20261009-2355">
</head>
<body>

  <section id="screen-nurse">
    <div class="appbar">
      <div class="brand">
        <button type="button" class="menu-btn" id="sidebarToggle" aria-controls="patientSidebar" aria-haspopup="dialog" aria-expanded="false" onclick="toggleSidebar()"><span class="menu-icon">☰</span><span>患者一覧</span></button>
        <span class="mark serif">めっちゃかんご</span>
        <span class="tag">NURSE MODE</span>
      </div>
      <div class="appbar-right">
        <span class="mode-pill nurse"><span class="dot"></span><span id="nurseWelcome">看護師として閲覧中</span></span>
        <button class="switch-btn" onclick="goTo('interviews.html')">📅 面談予定</button>
        <button class="switch-btn hidden" id="adminLink" onclick="goTo('../admin/index.html')">⚙ 管理</button>
        <button class="switch-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <div class="shell" id="nurseShell">
      <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="setSidebar(false)"></div>
      <div class="sidebar" id="patientSidebar" role="dialog" aria-label="患者一覧">
        <div class="sidebar-modal-head">
          <b>患者一覧</b>
          <button type="button" class="sidebar-close" aria-label="閉じる" onclick="setSidebar(false)">×</button>
        </div>
        <div class="label" id="patientCountLabel">担当患者</div>
        <div class="sidebar-search-row">
          <input type="text" id="patientSearch" placeholder="🔍 患者名で検索" oninput="renderPatientList()">
          <select id="patientSexFilter" onchange="renderPatientList()">
            <option value="">性別：全て</option>
            <option value="2">女性</option>
            <option value="1">男性</option>
          </select>
        </div>
        <!-- 管理者だけに出る -->
        <button id="addPatientBtn" class="hidden sidebar-add-btn"
          onclick="openPatientForm({ mode: 'create', onDone: async id => { await loadPatientList(); renderPatient(id); } })">＋ 新規患者を登録</button>
        <p class="sidebar-hint">☆を押すとお気に入りになり、一覧の上に固定されます。</p>

        <div id="patientListWrap">
          <div id="patientList"><div class="empty" style="padding:16px 8px;">読み込み中…</div></div>
        </div>
      </div>
      <div class="main" id="nurseMain"></div>
    </div>
  </section>


<div class="toast" id="toast"></div>

<script src="../shared/js/config.js?v=20261009-2355"></script>
<script src="../shared/js/utils.js?v=20261009-2355"></script>
<script src="../shared/js/db.js?v=20261009-2355"></script>
<script src="../shared/js/hash.js?v=20261009-2355"></script>
<script src="../shared/js/session.js?v=20261009-2355"></script>
<script src="../shared/js/api/master.js?v=20261009-2355"></script>
<script src="../shared/js/api/employee.js?v=20261009-2355"></script>
<script src="../shared/js/api/patient.js?v=20261009-2355"></script>
<script src="../shared/js/api/symptom.js?v=20261009-2355"></script>
<script src="../shared/js/api/memo.js?v=20261009-2355"></script>
<script src="../shared/js/api/ai-summary.js?v=20261009-2355"></script>
<script src="../shared/js/api/favorite.js?v=20261009-2355"></script>
<script src="../shared/js/api/family.js?v=20261009-2355"></script>
<script src="../shared/js/api/chat.js?v=20261009-2355"></script>
<script src="../shared/js/api/read-status.js?v=20261009-2355"></script>
<script src="../shared/js/ui/modal.js?v=20261009-2355"></script>
<script src="../shared/js/ui/patient-form.js?v=20261009-2355"></script>
<script src="js/state.js?v=20261009-2355"></script>
<script src="js/patient-list.js?v=20261009-2355"></script>
<script src="js/patient-detail.js?v=20261009-2355"></script>
<script src="js/main.js?v=20261009-2355"></script>
</body>
</html>
