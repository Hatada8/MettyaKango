<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>めっちゃかんご | ご家族</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="family.css">
</head>
<body>

  <section id="screen-family">
    <div class="appbar">
      <div class="brand">
        <span class="mark serif">めっちゃかんご</span>
        <span class="tag">FAMILY MODE</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="mode-pill family"><span class="dot"></span><span id="familyWelcome">家族として閲覧中</span></span>
        <button class="switch-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <div class="main" style="max-width:760px; margin:0 auto; padding-top:32px;">

      <div class="family-hero">
        <div class="l">
          <h2 id="familyPatientName">読み込み中…</h2>
          <p id="familyPatientMeta"></p>
        </div>
      </div>

      <div class="card">
        <h3><span class="n">●</span> 病状について</h3>
        <p class="muted keyword-hint">気になる言葉をタップすると、説明が表示されます。</p>
        <div class="keyword-list" id="keywordList"><span class="muted">読み込み中…</span></div>
        <div class="keyword-detail hidden" id="keywordDetail" aria-live="polite"></div>
      </div>


      <div class="card">
        <h3>💬 病棟とのメッセージ</h3>
        <div class="chat" id="chatBox">
          <div class="empty">読み込み中…</div>
        </div>
        <p class="chat-closed hidden" id="chatClosedNote">退院されたため、メッセージの送信はできません。これまでのやりとりは、ご覧いただけます。</p>
        <div class="chat-input" id="chatInputArea">
          <input id="chatInput" type="text" placeholder="メッセージを入力…" onkeydown="if(event.key==='Enter' && !event.isComposing) sendMsg()">
          <button class="chat-send" onclick="sendMsg()">送信</button>
        </div>
        <div class="stamp-row" id="stampRow">
          <button class="stamp-btn" onclick="sendStamp('ありがとうございます😊')">🙏 ありがとうございます</button>
          <button class="stamp-btn" onclick="sendStamp('安心しました')">😌 安心しました</button>
          <button class="stamp-btn" onclick="sendStamp('よろしくお願いします')">🙇 よろしくお願いします</button>
        </div>
      </div>

    </div>
  </section>


<div class="toast" id="toast"></div>

<script src="../shared/js/config.js"></script>
<script src="../shared/js/utils.js"></script>
<script src="../shared/js/db.js"></script>
<script src="../shared/js/session.js"></script>
<script src="../shared/js/api/master.js"></script>
<script src="../shared/js/api/patient.js"></script>
<script src="../shared/js/api/symptom.js"></script>
<script src="../shared/js/api/memo.js"></script>
<script src="../shared/js/api/ai-summary.js"></script>
<script src="../shared/js/api/chat.js"></script>
<script src="js/state.js"></script>
<script src="js/chat.js"></script>
<script src="js/main.js"></script>
</body>
</html>
