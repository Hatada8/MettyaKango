<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>めっちゃかんご | 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

  <section id="screen-admin">
    <div class="appbar">
      <div class="brand">
        <span class="mark serif">めっちゃかんご</span>
        <span class="tag">ADMIN MODE</span>
      </div>
      <div class="appbar-right">
        <span class="mode-pill patient"><span class="dot"></span><span id="adminWelcome">管理者として閲覧中</span></span>
        <button class="switch-btn" onclick="goTo('../nurse/index.html')">← 看護師画面</button>
        <button class="switch-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <div class="main admin-main">
      <div class="auth-tabs" id="adminTabs">
        <button type="button" class="auth-tab" data-tab="employees" data-perm="can_employee_manage">職員</button>
        <button type="button" class="auth-tab" data-tab="masters" data-perm="can_master_manage">マスタ</button>
        <button type="button" class="auth-tab" data-tab="patients" data-perm="can_patient_delete">患者さん</button>
      </div>
      <p class="muted">削除したデータは消えずに「削除済み」として残り、あとから元に戻せます。</p>

      <!-- 職員 -->
      <div class="card hidden" id="tab-employees">
        <h3><span class="n">●</span> 職員
          <span class="head-tools">
            <label class="check"><input type="checkbox" id="showDeletedEmployees"> 削除済みも表示</label>
            <button type="button" class="primary small" onclick="openEmployeeForm()">＋ 職員を登録</button>
          </span>
        </h3>
        <p class="muted" style="margin-top:-6px;">ログインは「職員番号＋パスワード」です。役割（職種）と権限は別々に選べます。</p>
        <div class="table-wrap"><table class="list" id="employeeTable"></table></div>
      </div>

      <!-- マスタ -->
      <div class="hidden" id="tab-masters">
        <div class="grid2">
          <div class="card" id="master-department"><div class="empty">読み込み中…</div></div>
          <div class="card" id="master-role"><div class="empty">読み込み中…</div></div>
        </div>
        <div class="card" id="master-hospital"><div class="empty">読み込み中…</div></div>
        <div class="card" id="master-symptom"><div class="empty">読み込み中…</div></div>
        <div class="card">
          <h3><span class="n">●</span> 権限</h3>
          <p class="muted" style="margin-top:-6px;">それぞれの権限で「できること」を選べます。新しい権限を足すこともできます。</p>
          <div class="table-wrap"><table class="list" id="permissionTable"></table></div>
          <form class="chip-add" id="permissionAddForm">
            <input class="input" id="newPermissionName" placeholder="新しい権限の名前（例：副管理者）">
            <button type="submit" class="light small">追加</button>
          </form>
        </div>
      </div>

      <!-- 患者さん -->
      <div class="card hidden" id="tab-patients">
        <h3><span class="n">●</span> 患者さん
          <span class="head-tools">
            <button type="button" class="primary small hidden" id="adminNewPatientBtn"
              onclick="openPatientForm({ mode: 'create', onDone: loadAdminPatients })">＋ 新規患者を登録</button>
          </span>
        </h3>
        <p class="muted" style="margin-top:-6px;">退院した方・削除した方も含めた一覧です。</p>
        <div class="table-wrap"><table class="list" id="patientTable"></table></div>
      </div>

      <div class="card hidden" id="noPermission"><div class="empty">この画面を使う権限がありません。</div></div>
    </div>
  </section>


<div class="toast" id="toast"></div>

<script src="../shared/js/config.js"></script>
<script src="../shared/js/utils.js"></script>
<script src="../shared/js/db.js"></script>
<script src="../shared/js/hash.js"></script>
<script src="../shared/js/session.js"></script>
<script src="../shared/js/api/master.js"></script>
<script src="../shared/js/api/employee.js"></script>
<script src="../shared/js/api/patient.js"></script>
<script src="../shared/js/api/symptom.js"></script>
<script src="../shared/js/ui/modal.js"></script>
<script src="../shared/js/ui/patient-form.js"></script>
<script src="js/employees.js"></script>
<script src="js/masters.js"></script>
<script src="js/patients.js"></script>
<script src="js/main.js"></script>
</body>
</html>
